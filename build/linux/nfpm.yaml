# nfpm.yaml — Linux 安装包内容定义。
# 由 scripts/package-linux.sh 调用，版本号与架构通过环境变量注入。
# 变更此文件后必须跑一次 make package 验证。
#
# 运行时依赖与 Wails 的 webkit2_41 构建标签保持一致。
# deb 与 rpm 的包名体系不同，因此按 packager 分别声明。

name: go-studio
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: 29anan29 <anwang13@outlook.com>
vendor: 29anan29
homepage: https://github.com/29anan29/Go-Studio
license: MIT
description: |
  Minimal, command-palette-first desktop IDE for Go and cloud-native
  development. The default window is a full-screen editor plus one status
  bar; every feature is reachable from the command palette.

contents:
  - src: ./build/bin/go-studio
    dst: /usr/bin/go-studio
    file_info:
      mode: 0755
  - src: ./build/linux/go-studio.desktop
    dst: /usr/share/applications/go-studio.desktop
    file_info:
      mode: 0644
  - src: ./build/linux/go-studio.svg
    dst: /usr/share/icons/hicolor/scalable/apps/go-studio.svg
    type: config
    file_info:
      mode: 0644
  # 位图尺寸用于不认可可缩放图标的桌面环境。
  - src: ./build/linux/icons/16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/go-studio.png
    type: config
  - src: ./build/linux/icons/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/go-studio.png
    type: config
  - src: ./build/linux/icons/48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/go-studio.png
    type: config
  - src: ./build/linux/icons/64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/go-studio.png
    type: config
  - src: ./build/linux/icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/go-studio.png
    type: config
  - src: ./build/linux/icons/256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/go-studio.png
    type: config
  - src: ./build/linux/icons/512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/go-studio.png
    type: config
  - src: ./License.md
    dst: /usr/share/doc/go-studio/copyright
    type: config
    file_info:
      mode: 0644

# overrides.<packager> 里的压缩算法与分组是 packager 专有字段，
# 按 nfpm 的 schema 需要再嵌一层同名键。
overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
    deb:
      compression: xz
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
    rpm:
      compression: xz
      group: Development/Tools
