version: 2

# 依赖更新分三个生态：Go 模块、npm 包、GitHub Actions。
# 全部使用周更 + PR 方式，重大版本单独确认，避免自动合并破坏构建。
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: 'build(deps)'
    # wails 绑定的类型定义由 wails CLI 生成，升级 wails 时必须重新生成并跑测试。
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      testing:
        patterns:
          - vitest
          - jsdom
          - '@testing-library/*'
      linting:
        patterns:
          - eslint
          - '@eslint/*'
          - 'typescript-eslint'
          - 'eslint-plugin-*'
          - globals
          - prettier
      build:
        patterns:
          - vite
          - '@vitejs/*'
          - typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'build(ci)'
    groups:
      # Actions 升级最容易引发意外行为，统一放进一个 PR 便于整体验证。
      actions:
        patterns:
          - '*'
