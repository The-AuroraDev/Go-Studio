# Go Studio CI — 与本地 make check 保持同一套门禁。
# Linux 构建需要 webkit2gtk-4.1，对应 wails 的 webkit2_41 build tag。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR 的新推送取消旧运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # make check = fmt-check + typecheck + lint + test + style + icons，
      # 与开发者提交前跑的是同一条命令。
      - name: make check
        run: make check

      - name: 上传 Go 覆盖率
        if: always()
        run: go test -tags webkit2_41 -coverprofile=coverage.out ./...
        working-directory: .

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage
          path: coverage.out

  build-linux:
    name: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: 构建二进制
        run: make build

      - name: 上传二进制
        uses: actions/upload-artifact@v7
        with:
          name: go-studio-linux-amd64
          path: build/bin/go-studio

  package-linux:
    name: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: 安装 nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - uses: actions/download-artifact@v8
        with:
          name: go-studio-linux-amd64
          path: build/bin

      # 在 PR 上就验证打包链路，避免只有打 tag 时才发现 nfpm 配置坏了。
      - name: 构建 deb 与 rpm
        run: make package

      - name: 校验包内容
        run: |
          dpkg-deb -c build/dist/*.deb | grep -q '/usr/bin/go-studio'
          dpkg-deb -c build/dist/*.deb | grep -q 'go-studio.desktop'
          file build/dist/*.rpm | grep -q 'RPM v3'

      - uses: actions/upload-artifact@v7
        with:
          name: go-studio-linux-packages
          path: build/dist
