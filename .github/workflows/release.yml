# Go Studio Release — 推送形如 v1.2.3 的 tag 时构建 Linux 安装包并发到 GitHub Release。
# macOS dmg 与 Windows msi 属于阶段 11，届时在本工作流追加矩阵。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动触发时使用的 tag，例如 v1.2.3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # 未经门禁的 tag 不允许发布。
      - name: make check
        run: make check

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: 安装 nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # 校验 tag 与 wails.json 的 productVersion 一致，避免出现两个版本真源。
      - name: 解析并校验版本号
        id: version
        run: |
          set -eu
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          tag_version="${tag#v}"
          file_version=$(sh scripts/product-version.sh)
          if [ "$tag_version" != "$file_version" ]; then
            printf 'tag 版本 %s 与 wails.json 的 %s 不一致\n' \
              "$tag_version" "$file_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$tag_version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: 构建二进制
        run: make build

      - name: 构建 deb 与 rpm
        run: make package

      - name: 校验包内容
        run: |
          dpkg-deb -c build/dist/*.deb | grep -q '/usr/bin/go-studio'
          dpkg-deb -c build/dist/*.deb | grep -q 'go-studio.desktop'
          file build/dist/*.rpm | grep -q 'RPM v3'

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: build/dist

  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/dist

      - name: 生成发布说明
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          {
            printf '## Go Studio %s\n\n' "$TAG"
            printf '### 安装\n\n'
            printf '```sh\n'
            printf '# Debian / Ubuntu\n'
            printf 'sudo apt install ./go-studio_%s_amd64.deb\n\n' "$VERSION"
            printf '# Fedora / openSUSE\n'
            printf 'sudo dnf install ./go-studio_%s_amd64.rpm\n' "$VERSION"
            printf '```\n\n'
            printf '### 校验\n\n'
            printf '```sh\nsha256sum -c SHA256SUMS\n```\n\n'
            printf '### 运行时依赖\n\n'
            printf 'libgtk-3 与 webkit2gtk 4.1。缺少时包管理器会自动安装。\n'
          } > "$TAG release-notes.md"
          cat "$TAG release-notes.md"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Go Studio $TAG" \
            --notes-file "$TAG release-notes.md" \
            build/dist/*.deb \
            build/dist/*.rpm \
            build/dist/SHA256SUMS \
            --verify-tag
